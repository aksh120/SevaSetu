<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 1024px;
      height: 1024px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }
    .badge {
      width: 1024px;
      height: 1024px;
      border-radius: 225px; /* Premium iOS/macOS squircle rounded corners */
      background: radial-gradient(130% 130% at 30% 20%, #1c5b64 0%, #14464D 45%, #0B2B30 100%);
      box-shadow: inset 0 0 0 4px rgba(245, 158, 11, 0.25), inset 0 2px 10px rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Subtle background ambient light */
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(20, 70, 77, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .bridge-svg {
      width: 680px;
      height: 680px;
      filter: drop-shadow(0 16px 32px rgba(0, 0, 0, 0.4)) drop-shadow(0 2px 8px rgba(245, 158, 11, 0.3));
    }
  </style>
</head>
<body>
  <div class="badge">
    <div class="glow"></div>
    <svg class="bridge-svg" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FDE68A" />
          <stop offset="30%" stop-color="#F59E0B" />
          <stop offset="70%" stop-color="#D97706" />
          <stop offset="100%" stop-color="#B45309" />
        </linearGradient>
        <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8" />
          <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.95" />
          <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.8" />
        </linearGradient>
      </defs>
      
      <!-- Foundation Base Beam -->
      <path d="M4 25.5h24" stroke="url(#goldGrad)" stroke-width="2.4" stroke-linecap="round" />
      
      <!-- Vertical Pillars (Pylons) -->
      <path d="M9 25.5V11.5M16 25.5V8M23 25.5V11.5" stroke="url(#goldGrad)" stroke-width="2.3" stroke-linecap="round" />
      
      <!-- Horizontal Lintel Crossbars -->
      <path d="M6.5 11.5h5M13.5 8h5M20.5 11.5h5" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linecap="round" />
      
      <!-- Suspension Cables -->
      <path d="M9 11.5c2.3 3.5 4.6 5.2 7 5.2s4.7-1.7 7-5.2" stroke="url(#cableGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
    </svg>
  </div>
</body>
</html>
